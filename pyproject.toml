[project]
name = "mtglc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nils Brast", email = "nilsbrast@science-node.de" }
]
requires-python = ">=3.12"
dependencies = [
    "eumdac>=3.1.1",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "satpy>=0.60,<1.0",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = ["needs_data: requires local data, model weights or external services"]
